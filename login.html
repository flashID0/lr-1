<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Форма входу</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f7fa;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 300px;
      text-align: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 20px;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    button:hover {
      background-color: #004d40;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Авторизація</h2>
    <input type="text" id="login" placeholder="Введіть логін">
    <input type="password" id="password" placeholder="Введіть пароль">
    <button onclick="checkLogin()">Увійти</button>
    <div class="message" id="message"></div>
  </div>

  <script>
    function checkLogin() {
      const login = document.getElementById("login").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!login) {
        message.textContent = "Скасовано (логін порожній)";
        message.style.color = "orange";
        return;
      }

      if (login === "Admin") {
        if (!password) {
          message.textContent = "Скасовано (пароль порожній)";
          message.style.color = "orange";
        } else if (password === "Господар") {
          message.textContent = "Ласкаво просимо!";
          message.style.color = "green";
        } else {
          message.textContent = "Неправильний пароль";
          message.style.color = "red";
        }
      } else {
        message.textContent = "Я вас не знаю";
        message.style.color = "red";
      }
    }
  </script>

</body>
</html>
